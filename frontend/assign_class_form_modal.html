<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Asignar materia </title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .blur-bg {
            backdrop-filter: blur(8px);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 antialiased overflow-hidden">
<!-- Blurred Calendar Background Context -->
<div class="fixed inset-0 z-0 flex flex-col pointer-events-none opacity-40 blur-sm">
<header class="h-16 border-b border-slate-200 bg-white flex items-center px-8 justify-between">
<div class="flex items-center gap-4">
<div class="h-8 w-8 bg-primary rounded-lg"></div>
<div class="h-4 w-32 bg-slate-200 rounded"></div>
</div>
<div class="flex gap-4">
<div class="h-8 w-8 bg-slate-200 rounded-full"></div>
<div class="h-8 w-8 bg-slate-200 rounded-full"></div>
</div>
</header>
<div class="flex-1 grid grid-cols-7 gap-px bg-slate-200 p-4">
<!-- Mock Calendar Grid -->
<div class="bg-white h-full p-4">
<div class="h-4 w-8 bg-slate-100 rounded mb-4"></div>
<div class="h-12 w-full bg-primary/10 border-l-4 border-primary rounded mb-2"></div>
</div>
<div class="bg-white h-full p-4">
<div class="h-4 w-8 bg-slate-100 rounded mb-4"></div>
<div class="h-12 w-full bg-primary/10 border-l-4 border-primary rounded mb-2"></div>
<div class="h-12 w-full bg-slate-50 border-l-4 border-slate-300 rounded"></div>
</div>
<div class="bg-white h-full p-4">
<div class="h-4 w-8 bg-slate-100 rounded mb-4"></div>
</div>
<div class="bg-white h-full p-4">
<div class="h-4 w-8 bg-slate-100 rounded mb-4"></div>
<div class="h-12 w-full bg-primary/10 border-l-4 border-primary rounded mb-2"></div>
</div>
<div class="bg-white h-full p-4">
<div class="h-4 w-8 bg-slate-100 rounded mb-4"></div>
</div>
<div class="bg-white h-full p-4">
<div class="h-4 w-8 bg-slate-100 rounded mb-4"></div>
<div class="h-12 w-full bg-primary/10 border-l-4 border-primary rounded mb-2"></div>
</div>
<div class="bg-white h-full p-4">
<div class="h-4 w-8 bg-slate-100 rounded mb-4"></div>
</div>
</div>
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 blur-bg">
<!-- Modal Content Container -->
<div class="bg-white dark:bg-slate-900 w-full max-w-[640px] shadow-2xl rounded-xl overflow-hidden flex flex-col max-h-[90vh]">
<!-- Modal Header -->
<div class="px-8 py-6 border-b border-slate-100 flex items-start justify-between">
<div class="flex flex-col gap-1">
<h2 class="text-2xl font-bold text-slate-900 tracking-tight">Assign Class</h2>
<p class="text-slate-500 text-sm font-normal">Fill in the details below to schedule a new session.</p>
</div>
<button class="p-2 hover:bg-slate-100 rounded-full transition-colors">
<span class="material-symbols-outlined text-slate-400">close</span>
</button>
</div>
<!-- Scrollable Form Body -->
<div class="flex-1 overflow-y-auto px-8 py-6 custom-scrollbar">
<form class="space-y-6">
<!-- Class Title -->
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-slate-700" for="class-title">Class Title</label>
<input class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all placeholder:text-slate-400" id="class-title" placeholder="e.g. Advanced Mathematics 101" type="text"/>
</div>
<!-- Teacher Selection -->
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-slate-700">Assign Teacher</label>
<div class="relative group">
<select class="appearance-none w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all pr-10">
<option disabled="" selected="" value="">Search for a teacher...</option>
<option value="1">Dr. Sarah Jenkins (Math Dept)</option>
<option value="2">Prof. Marcus Thorne (Physics)</option>
<option value="3">Elena Rodriguez (Art &amp; Design)</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">unfold_more</span>
</div>
</div>
<!-- Students Selection (Multi-select UI) -->
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-slate-700">Enrolled Students</label>
<div class="min-h-[48px] p-2 border border-slate-200 rounded-lg flex flex-wrap gap-2 items-center">
<!-- Selected Tags -->
<div class="flex items-center gap-1.5 bg-primary/10 border border-primary/20 text-primary px-3 py-1 rounded-full text-xs font-medium">
<span>Alice Thompson</span>
<button class="material-symbols-outlined text-[14px]" type="button">close</button>
</div>
<div class="flex items-center gap-1.5 bg-primary/10 border border-primary/20 text-primary px-3 py-1 rounded-full text-xs font-medium">
<span>Robert Chen</span>
<button class="material-symbols-outlined text-[14px]" type="button">close</button>
</div>
<div class="flex items-center gap-1.5 bg-primary/10 border border-primary/20 text-primary px-3 py-1 rounded-full text-xs font-medium">
<span>Sarah Miller</span>
<button class="material-symbols-outlined text-[14px]" type="button">close</button>
</div>
<input class="flex-1 min-w-[120px] border-none focus:ring-0 text-sm py-1 placeholder:text-slate-400" placeholder="Add students..." type="text"/>
</div>
</div>
<!-- Date and Time Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-slate-700">Schedule Date</label>
<div class="relative">
<input class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all" type="date" value="2023-10-05"/>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">calendar_today</span>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-slate-700">Time Range</label>
<div class="flex items-center gap-2">
<input class="w-full px-3 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm" type="time" value="09:00"/>
<span class="text-slate-400">to</span>
<input class="w-full px-3 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm" type="time" value="10:30"/>
</div>
</div>
</div>
<!-- Classroom Selection -->
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-slate-700">Select Classroom</label>
<div class="grid grid-cols-3 gap-3">
<label class="relative cursor-pointer">
<input checked="" class="peer sr-only" name="classroom" type="radio"/>
<div class="p-3 border border-slate-200 rounded-lg text-center peer-checked:border-primary peer-checked:bg-primary/5 transition-all">
<p class="text-xs font-bold text-slate-900">Lab 302</p>
<p class="text-[10px] text-slate-500">Main Building</p>
</div>
<div class="absolute top-2 right-2 hidden peer-checked:block">
<div class="bg-primary rounded-full p-0.5">
<span class="material-symbols-outlined text-white text-[12px] block">check</span>
</div>
</div>
</label>
<label class="relative cursor-pointer">
<input class="peer sr-only" name="classroom" type="radio"/>
<div class="p-3 border border-slate-200 rounded-lg text-center peer-checked:border-primary peer-checked:bg-primary/5 transition-all">
<p class="text-xs font-bold text-slate-900">Room 105</p>
<p class="text-[10px] text-slate-500">West Wing</p>
</div>
<div class="absolute top-2 right-2 hidden peer-checked:block">
<div class="bg-primary rounded-full p-0.5">
<span class="material-symbols-outlined text-white text-[12px] block">check</span>
</div>
</div>
</label>
<label class="relative cursor-pointer">
<input class="peer sr-only" name="classroom" type="radio"/>
<div class="p-3 border border-slate-200 rounded-lg text-center peer-checked:border-primary peer-checked:bg-primary/5 transition-all">
<p class="text-xs font-bold text-slate-900">Auditorium</p>
<p class="text-[10px] text-slate-500">South Block</p>
</div>
<div class="absolute top-2 right-2 hidden peer-checked:block">
<div class="bg-primary rounded-full p-0.5">
<span class="material-symbols-outlined text-white text-[12px] block">check</span>
</div>
</div>
</label>
</div>
</div>
<!-- Additional Notes -->
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-slate-700" for="notes">Additional Notes (Optional)</label>
<textarea class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all placeholder:text-slate-400" id="notes" placeholder="Add any specific instructions for this session..." rows="3"></textarea>
</div>
</form>
</div>
<!-- Modal Footer -->
<div class="px-8 py-6 border-t border-slate-100 bg-slate-50 flex items-center justify-end gap-4">
<button class="px-6 py-2.5 rounded-lg text-slate-600 font-semibold text-sm hover:bg-slate-200 transition-colors">
                    <a href="academic_class_calendar_view.html">Cancelar</a>
                </button>
<button class="px-8 py-2.5 rounded-lg bg-primary text-white font-semibold text-sm hover:bg-primary/90 shadow-lg shadow-primary/20 transition-all flex items-center gap-2">
<span class="material-symbols-outlined text-[20px]">event_available</span>
                    <a href="academic_class_calendar_view.html">Guardar clase</a>
                </button>
</div>
</div>
</div>
</body></html>
