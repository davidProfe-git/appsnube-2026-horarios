<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Gestión de Maestros - Sistema Escolar</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@300;400;500;600&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Lexend', sans-serif;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar Navigation -->
        <aside
            class="w-64 flex-shrink-0 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col">
            <div class="p-6">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-primary rounded-lg flex items-center justify-center text-white">
                        <span class="material-symbols-outlined">school</span>
                    </div>
                    <div>
                        <h1 class="text-sm font-bold leading-tight">Sistema Escolar</h1>

                    </div>
                </div>
            </div>
            <nav class="flex-1 px-4 space-y-1">

                <a class="flex items-center gap-3 px-3 py-2 bg-primary/10 text-primary rounded-lg transition-colors"
                    href="#">
                    <span class="material-symbols-outlined text-[20px]">group</span>
                    <span class="text-sm font-semibold">Maestros</span>
                </a>
                <a class="flex items-center gap-3 px-3 py-2 text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-lg transition-colors group"
                    href="#">
                    <span class="material-symbols-outlined text-[20px]">book</span>
                    <span class="text-sm font-medium">Materias</span>
                </a>
                <a class="flex items-center gap-3 px-3 py-2 text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-lg transition-colors group"
                    href="#">
                    <span class="material-symbols-outlined text-[20px]">calendar_month</span>
                    <span class="text-sm font-medium">Horarios</span>
                </a>

            </nav>
            <div class="p-4 border-t border-slate-200 dark:border-slate-800">
                <div class="flex items-center gap-3 p-2 rounded-lg bg-slate-50 dark:bg-slate-800">
                    <div
                        class="w-8 h-8 rounded-full bg-primary/20 flex items-center justify-center text-primary overflow-hidden">
                        <img alt="Admin Avatar" class="w-full h-full object-cover"
                            data-alt="Profile photo of the school administrator"
                            src="https://lh3.googleusercontent.com/aida-public/AB6AXuAHDNkUGkcKtd7WB4lZVPfGQgnMnK-ZgNSOQinJVhy_GrMvBgKe_c2_q9BlvgKe7txxFbHAtCn-ldsTkkH1l6CVZgp1hqHeuohpspZP_EfA-h221HVeI-TyOZyM8l2RsGozf3byjMGui0ndhtKXXvUf7PRU-dWJdFsEff92q5Jgq2sGQhSXGMgPLssGoK43ivJwuuxvVEqW4O9myQjtSHXuWn76BuoO-JB7O1MdW_-OMRB_NeZKrtBCP7B6FGqXgWheR2QGmh5U3mTK" />
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-xs font-semibold truncate">Administrador</p>
                        <p class="text-[10px] text-slate-500 truncate">admin@escuela.edu</p>
                    </div>
                </div>
            </div>
        </aside>
        <!-- Main Content -->
        <main class="flex-1 flex flex-col overflow-hidden">
            <!-- Header -->
            <header
                class="h-16 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-8">
                <div class="flex items-center gap-4">
                    <h2 class="text-xl font-bold">Gestión de Maestros</h2>
                </div>
                <div class="flex items-center gap-4">
                    <div class="relative">
                        <span
                            class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-[18px]">search</span>
                        <input
                            class="pl-10 pr-4 py-2 bg-slate-100 dark:bg-slate-800 border-none rounded-lg text-sm w-64 focus:ring-2 focus:ring-primary/50 transition-all"
                            placeholder="Buscar maestro..." type="text" />
                    </div>
                    <button
                        class="bg-primary hover:bg-primary/90 text-white px-4 py-2 rounded-lg flex items-center gap-2 text-sm font-semibold transition-all shadow-sm">
                        <span class="material-symbols-outlined text-[20px]">add</span>
                        Agregar Maestro
                    </button>
                </div>
            </header>
            <!-- Table Section -->
            <div class="flex-1 overflow-auto p-8">
                <div
                    class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr
                                class="bg-slate-50 dark:bg-slate-800/50 border-b border-slate-200 dark:border-slate-800">
                                <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-slate-500">Nombre
                                    del Maestro</th>
                                <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-slate-500">Materia
                                </th>
                                <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-slate-500">Correo
                                    Electrónico</th>
                                <th
                                    class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-slate-500 text-right">
                                    Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla" class="divide-y divide-slate-200 dark:divide-slate-800">
                            <!-- Row 1 -->
                            

                            <!-- Pagination Footer -->
                            <div
                                class="px-6 py-4 bg-slate-50 dark:bg-slate-800/50 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between">
                                <p class="text-xs text-slate-500 font-medium">Mostrando <span
                                        class="text-slate-800 dark:text-slate-200">1-4</span> de <span
                                        class="text-slate-800 dark:text-slate-200">24</span> maestros</p>
                                <div class="flex items-center gap-2">
                                    <button
                                        class="p-1 rounded border border-slate-200 dark:border-slate-700 text-slate-400 disabled:opacity-50"
                                        disabled="">
                                        <span class="material-symbols-outlined text-[18px]">chevron_left</span>
                                    </button>
                                    <button
                                        class="w-7 h-7 flex items-center justify-center bg-primary text-white text-xs font-bold rounded">1</button>
                                    <button
                                        class="w-7 h-7 flex items-center justify-center text-slate-600 dark:text-slate-400 text-xs font-medium hover:bg-slate-200 dark:hover:bg-slate-700 rounded transition-colors">2</button>
                                    <button
                                        class="w-7 h-7 flex items-center justify-center text-slate-600 dark:text-slate-400 text-xs font-medium hover:bg-slate-200 dark:hover:bg-slate-700 rounded transition-colors">3</button>
                                    <button
                                        class="p-1 rounded border border-slate-200 dark:border-slate-700 text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 hover:border-slate-300 transition-colors">
                                        <span class="material-symbols-outlined text-[18px]">chevron_right</span>
                                    </button>
                                </div>
                            </div>
                </div>
            </div>
        </main>
    </div>


    <script src="js/app.js"></script>
</body>

</html>
